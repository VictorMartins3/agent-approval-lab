name: Verify experiment
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check Python style
        run: |
          python -m pip install ruff==0.16.9
          ruff check .
          ruff format --check .
      - name: Run unit and boundary tests
        run: npm test
      - name: Recompute saved outcomes without model access
        run: |
          python3 verify_results.py
          python3 verify_evidence_results.py
      - name: Verify publication and regenerate site
        run: |
          python3 scripts/check_publication.py
          python3 scripts/build_site.py
          git diff --exit-code -- docs
